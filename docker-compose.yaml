services:

  mysql:
    image: mysql:8.4
    container_name: spring-crud-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: spring
      MYSQL_USER: spring
      MYSQL_PASSWORD: spring
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: